[project]
name = "databricks-lakehouse-recon"
version = "0.1.0"
description = "Delta Lake + Unity Catalog medallion lakehouse with the same reconciliation-as-a-control philosophy as lakehouse-recon-platform, ported from Trino/Iceberg to native Databricks"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.9",
    "delta-spark==3.3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "httpx2>=0.1"]

[project.scripts]
dbx-lakehouse = "databricks_lakehouse_recon.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "databricks: requires a real Databricks workspace (deselect with '-m \"not databricks\"')",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
